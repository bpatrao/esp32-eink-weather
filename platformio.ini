; LilyGO TTGO T5 V2.3 (2.13" e-paper, GDEH0213B73) - Wi-Fi weather display.
; See README.md for setup and upload instructions.
;
;   pio run -t upload                        build + flash the weather app (default env)
;   pio run -e weather_preview -t upload     app that also dumps every view over serial
;   pio run -e driver_test -t upload         e-paper panel/driver test sketch
;   pio run -e probe -t upload               pin probe (ADC voltages + button changes)
;   T5_OTA_HOST=<ip> T5_OTA_PASS=<pass> pio run -e ota -t upload
;                                            weather app over Wi-Fi (board in setup mode)

[platformio]
default_envs = weather

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  adafruit/Adafruit GFX Library@^1.11.9

[env:weather]
build_src_filter = +<*> -<driver_test/> -<probe/>
lib_deps =
  ${env.lib_deps}
  bblanchon/ArduinoJson@^7.2.0
  bitbank2/JPEGDEC@^1.6.1

[env:driver_test]
build_src_filter = +<driver_test/>
build_flags = -DPANEL_B73

[env:probe]
build_src_filter = +<probe/>
lib_deps =

; Same app, but dumps every view's frame buffer over serial after fetching
; (for checking layouts on a computer; see tools/frames_to_png.py).
[env:weather_preview]
build_src_filter = ${env:weather.build_src_filter}
lib_deps = ${env:weather.lib_deps}
build_flags = -DFRAME_DUMP

; The weather app, uploaded over Wi-Fi while the board is in setup mode (hold
; the button 3 s). HTTP POST to the board, so it works behind a firewall that
; blocks incoming connections (unlike espota). T5_OTA_HOST = the "OTA:" IP on
; the screen (or 192.168.4.1 when joined to the setup Wi-Fi), T5_OTA_PASS =
; the setup password on the screen.
[env:ota]
extends = env:weather
upload_protocol = custom
upload_command = curl --fail-with-body --max-time 120 -u ota:$$T5_OTA_PASS -F "fw=@$SOURCE" http://$$T5_OTA_HOST/update
